[project]
name = "answering-machine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cartesia-line>=0.2.2",
    "firebase-admin>=6.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
search = [
    "stagehand>=3.0.0",
    "google-genai>=1.26.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.35.0",
]

[tool.uv.sources]
cartesia-line = { path = "line", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
